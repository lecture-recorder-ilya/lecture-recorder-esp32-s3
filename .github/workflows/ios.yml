name: Сборка приложения iPhone
on:
  push:
    branches: [main]
    paths: ['outputs/ios/**', 'tools/build_ios_project.py', 'release.json', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Начать загрузку симулятора
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess

          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"]))["devices"]
          runtime, phone = next(
              (runtime, device) for runtime, group in devices.items() for device in group
              if device["isAvailable"] and device["name"].startswith("iPhone")
          )
          device_id = phone["udid"]
          print(f"{phone['name']} · {runtime} · {device_id}", flush=True)
          with open(os.environ["GITHUB_ENV"], "a") as env:
              print(f"IOS_SIMULATOR_UDID={device_id}", file=env)
          if phone["state"] == "Shutdown":
              subprocess.run(["xcrun", "simctl", "boot", device_id], check=True)
          PYTHON
      - name: Подготовить проект
        run: python3 tools/build_ios_project.py
      - name: Собрать для симулятора
        run: xcodebuild -project outputs/ios/LectureRecorder.xcodeproj -scheme LectureRecorder -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Собрать для iPhone без подписи
        run: xcodebuild -project outputs/ios/LectureRecorder.xcodeproj -scheme LectureRecorder -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/iphone CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: build/ios/Build/Products/Release-iphonesimulator/LectureRecorder.app
          retention-days: 7
      - name: Дождаться загрузки симулятора
        run: xcrun simctl bootstatus "$IOS_SIMULATOR_UDID" -b
      - name: Установить приложение в симуляторе
        run: |
          xcrun simctl install "$IOS_SIMULATOR_UDID" build/ios/Build/Products/Release-iphonesimulator/LectureRecorder.app
          xcrun simctl get_app_container "$IOS_SIMULATOR_UDID" ru.ilya.lecturerecorder.ios app
      - name: Проверить запуск приложения
        run: xcrun simctl launch "$IOS_SIMULATOR_UDID" ru.ilya.lecturerecorder.ios
