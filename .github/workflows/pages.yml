name: Сайт

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tests/site_motion.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Открыть репозиторий
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Проверить витрину и библиотеку
        run: |
          node --check site/device.js
          node --check site/home.js
          node --check site/motion.js
          node --check site/library.js
          test -s site/assets/recorder-poster.webp
          test -s site/assets/zu-prototype.glb
          test -s site/assets/controls.webp
          test -s site/library.html
      - name: Проверить поворот корпуса в браузере
        run: |
          npm install --prefix "$RUNNER_TEMP/web-check" --no-audit --no-fund --ignore-scripts playwright-core@1.62.1
          python3 -m http.server 4173 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/site-http.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          curl -fsS --retry 12 --retry-connrefused --retry-delay 1 http://127.0.0.1:4173/ -o /dev/null
          CHROME_BIN="$(command -v google-chrome)" NODE_PATH="$RUNNER_TEMP/web-check/node_modules" node --test tests/site_motion.cjs
      - name: Подготовить сайт
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Опубликовать сайт
        id: publish
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
