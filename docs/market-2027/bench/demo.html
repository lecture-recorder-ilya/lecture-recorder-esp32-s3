<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка расшифровки</title>
<style>
:root { color-scheme: light; font-family: "Inter", system-ui, sans-serif; background: #f6f5ee; color: #182c2a }
body { margin: 0 auto; max-width: 760px; padding: 32px 22px }
h1 { font-size: clamp(30px,5vw,47px); letter-spacing: -.035em; line-height: 1.06 }
h2 { font-size: 20px; margin-bottom: 6px }
p { line-height: 1.5 }
section { border-top: 1px solid #a1b2a7; padding: 8px 0 18px }
blockquote { margin: 12px 0; font-size: 21px; line-height: 1.4 }
mark { background: #ffe0a4 }
button { background: #174a43; color: white; font: inherit; padding: 9px 14px; border: 0; border-radius: 5px; cursor: pointer; margin: 6px 8px 6px 0 }
button:disabled { background: #52655d; cursor: default }
audio { width: 100%; margin: 8px 0 }
small,a { color: #345c53 }
</style>
<main>
<h1>Проверка расшифровки</h1>
<section>
<label>Аудиофайл <input type="file" id="file" accept="audio/*"></label>
<audio id="audio" controls preload="metadata"></audio>
<button type="button" id="start" disabled>Слушать с начала</button>
<label>Таймкод, с <input id="seconds" type="number" min="0" step="0.1" value="0"></label>
<button type="button" id="tail" disabled>Слушать с таймкода</button>
</section>
<section>
<label>Фраза <textarea id="phrase" rows="2"></textarea></label>
<button type="button" id="confirm" disabled>Текст проверен</button>
<p id="status" role="status"></p>
</section>
</main>
<script>
const audio = document.getElementById('audio');
const confirmButton = document.getElementById('confirm');
const statusText = document.getElementById('status');
const start = document.getElementById('start');
const tail = document.getElementById('tail');
const phrase = document.getElementById('phrase');
let source = '';
let confirmed = false;
function playFrom(second) {
  if (!Number.isFinite(audio.duration) || !Number.isFinite(second)) return;
  audio.currentTime = Math.max(0, Math.min(second, audio.duration));
  audio.play().catch(() => { statusText.textContent = 'Запустите воспроизведение кнопкой плеера.'; });
}
start.onclick = () => playFrom(0);
tail.onclick = () => playFrom(document.getElementById('seconds').valueAsNumber);
document.getElementById('file').onchange = event => {
  const file = event.target.files[0];
  if (!file) return;
  if (source) URL.revokeObjectURL(source);
  source = URL.createObjectURL(file);
  audio.src = source;
  start.disabled = tail.disabled = confirmButton.disabled = true;
  confirmed = false;
  statusText.textContent = '';
};
audio.onloadedmetadata = () => { start.disabled = tail.disabled = false; };
function updateListening() {
  const tolerance = Math.min(0.25, audio.duration / 10);
  let listened = false;
  for (let i = 0; i < audio.played.length; i++) {
    if (audio.played.start(i) <= tolerance && audio.played.end(i) >= audio.duration - tolerance) listened = true;
  }
  confirmButton.disabled = confirmed || !listened || !phrase.value.trim();
}
phrase.oninput = () => { confirmed = false; statusText.textContent = ''; updateListening(); };
audio.addEventListener('timeupdate', updateListening);
audio.addEventListener('ended', updateListening);
confirmButton.onclick = () => {
  confirmed = true;
  statusText.textContent = 'Текст сверен с записью.';
  confirmButton.disabled = true;
};
</script>
</html>
